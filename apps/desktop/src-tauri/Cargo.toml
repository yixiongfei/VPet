[package]
name = "vpet"
version = "0.0.1"
description = "VPet · 有身体的 Personal Agent —— Core（确定性核心）"
authors = ["yixiongfei"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.85"

[lib]
name = "vpet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
